<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; background: #0f0f1a; }
    #sigma-container { width: 100%; height: 400px; }
  </style>
</head>
<body>
<div id="sigma-container"></div>

<script src="https://cdn.jsdelivr.net/npm/graphology@0.25.4/dist/graphology.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sigma@2.4.0/build/sigma.min.js"></script>

<script>
fetch("hairball.json")
  .then(r => r.json())
  .then(data => {
    const graph = new graphology.Graph();

    data.nodes.forEach(n => {
      graph.addNode(String(n.id), {
        x: n.x, y: n.y,
        size: 1,
        color: "#00d4ff"
      });
    });

    data.edges.forEach(e => {
      try {
        graph.addEdge(String(e.source), String(e.target));
      } catch(_) {}
    });

    new Sigma(graph, document.getElementById("sigma-container"), {
      renderEdgeLabels: false,
      edgeReducer: (edge, data) => ({ ...data, color: "#ff8c0044", size: 0.3 }),
      defaultNodeColor: "#00d4ff"
    });
  });
</script>
</body>
</html>
